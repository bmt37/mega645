function BE(){
  const B=S.b=S.b||{},n=F.n,fr=parseInt(B.from),to=parseInt(B.to);let s=0,e=n-1;
  if(!isNaN(fr)){s=D.findIndex(r=>r[0]>=fr);if(s<0)s=n}
  if(!isNaN(to)){e=-1;for(let i=0;i<n;i++)if(D[i][0]<=to)e=i}
  const N=e-s+1,Wn=Math.max(1,Math.min(+B.w||50,N)),mp=(B.mp!=null&&B.mp!==''?+B.mp:10)/100;
  if(N<30)return{s,e,N,err:1};

  lvl=(v,t)=>v>=t[2]?3:v>=t[1]?2:v>=t[0]?1:0,sig=[];let pass=0;
  BC().forEach(c=>{
    if(c.f(e)<0)return;let h=0,m=0,last=-1,rec=0,mr=0,maxG=0,curG=0;

    }
    if(curG>maxG)maxG=curG;
    if(m<30)return;const p=h/m;if(p<mp-1e-9||p>.999)return;pass++;
    if(!c.sl){const g=e-last,r=g*p,lv=lvl(r,GT);if(lv)sig.push({c,ty:'gan',lv,p,g,r,st:r,maxG,pr:Math.pow(1-p,g)})}
    const T=mr,ex=T*p,sd=Math.sqrt(T*p*(1-p)),z=sd?(rec-ex)/sd:0,ra=ex?rec/ex:0;
    if(rec>=2&&(ra>=ZT[0]||z>=ZT[0]))sig.push({c,ty:'hot',lv:Math.max(lvl(ra,ZT),lvl(z,ZT)),p,rec,T,ex,z,ra,st:Math.max(z,0),maxG,pr:bt(T,p,rec,1)});

  });
  return{s,e,N,Wn,mp,pass,sig}
}

function pv(){const a=nums($('#nb').value).sort((x,y)=>x-y),bad=a.length>6||a.some(x=>x<1||x>45)||new Set(a).size<a.length;$('#pvw').innerHTML=rg(1,6).map(i=>`<span style="display:inline-block;margin:0 8px 6px 0;font-size:12px;color:var(--m)">No${i} <span class=ball${bad?' style="border-color:var(--r)"':''}>${a[i-1]!=null?p2(a[i-1]):'··'}</span></span>`).join('')+(bad?'<div class=s style="color:var(--r)">Cần đúng 6 số khác nhau, từ 1 đến 45.</div>':'')}
const MAXN=45,SRC='https://www.lotto-8.com/Vietnam/listltoVM45.asp?indexpage=1';let GO=0,GT='';
function gparse(t){const o=[],ok=a=>a.length==6&&a.every(x=>x>=1&&x<=MAXN)&&new Set(a).size==6;t.split(/[\t\r\n]+/).forEach(c=>{if(/^\s*\d{1,2}(\s*,\s*\d{1,2}){5}\s*$/.test(c)){const a=nums(c);if(ok(a))o.push(a)}});if(!o.length)(t.match(/\d{1,2}(?:\s*,\s*\d{1,2}){5}(?!\s*,\s*\d)/g)||[]).forEach(c=>{const a=nums(c);if(ok(a))o.push(a)});return o}

if(j<0)return{m:`Không thấy kỳ #${D[n-1][0]} (${D[n-1].slice(1).map(p2).join(' ')}) trong dữ liệu đã dán (đọc được ${it.length} kỳ). Hãy dán thêm trang cũ hơn (trang 2, 3…) cùng một lượt.`};const nw=it.slice(0,j).reverse().map((a,i)=>[D[n-1][0]+1+i,...a.slice().sort((x,y)=>x-y)]);return{nw,m:nw.length?'':'Dữ liệu đã là mới nhất, không có kỳ nào để thêm.'}}
function gprevH(){if(!GT.trim())return'';const p=gplan();if(!p.nw||!p.nw.length)return`<p class=s>${p.m}</p>`;return`<p class=s>Tìm thấy kỳ #${D[D.length-1][0]} trong dữ liệu dán. Sẽ thêm ${p.nw.length} kỳ mới:</p><div class=res style="max-height:160px">${p.nw.map(r=>'#'+r[0]+' · '+r.slice(1).map(p2).join(' ')).join('<br>')}</div><button class=p onclick="gadd()">Thêm ${p.nw.length} kỳ</button>`}

let NFO=0,NFR=null;
const nfN=s=>String(s==null?'':s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/đ/g,'d').replace(/[^a-z0-9]/g,'');
const nfEsc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const nfInt=x=>{const t=String(x==null?'':x).replace(/[#\s]/g,'');return /^\d+(\.0+)?$/.test(t)?Math.round(+t):NaN};
function nfHdr(c){const m={k:-1,n:[-1,-1,-1,-1,-1,-1]};c.forEach((x,i)=>{const t=nfN(x);if(/^(ky|kyquay|kyso|draw|drawid|drawno|period|id)$/.test(t)){if(m.k<0)m.k=i}else{const r=/^(no|n|s|num|so|ball|b|number)([1-6])$/.exec(t);if(r&&m.n[r[2]-1]<0)m.n[r[2]-1]=i}});return m.n.every(i=>i>=0)?m:null}
function nfRow(c,st){c=c.map(x=>x==null?'':String(x).trim());if(!c.some(x=>x!==''))return;const hm=nfHdr(c);if(hm){st.m=hm;st.h++;return}if(!c.some(x=>/\d/.test(x))){st.h++;return}
let kv,ns;if(st.m){kv=st.m.k>=0?c[st.m.k]:'';ns=st.m.n.map(i=>c[i])}else{const t=[];c.forEach(x=>{const q=x.replace(/^#/,'');if(/^\d+(\.0+)?$/.test(q))t.push(q);else if(/^[\d\s,;]+$/.test(q))(q.match(/\d+/g)||[]).forEach(v=>t.push(v));else if(q!=='')t.push('x')});if(t.length!=7){st.bad++;return}kv=t[0];ns=t.slice(1)}
const k=nfInt(kv),a=ns.map(nfInt);if(!(k>0)||a.some(x=>isNaN(x))){st.bad++;return}if(a.some(x=>x<1||x>MAXN)||new Set(a).size<6){st.rng++;return}st.ok.push([k,...a.slice().sort((x,y)=>x-y)])}
function nfText(t,st){t.replace(/^\uFEFF/,'').split(/\r?\n/).forEach(l=>{if(!l.trim())return;nfRow((/[,;\t|]/.test(l)?l.split(/[,;\t|]/):l.trim().split(/\s+/)).map(x=>x.trim().replace(/^["']+|["']+$/g,'')),st)})}
function nfJson(j,st){const arr=Array.isArray(j)?j:(()=>{if(j&&typeof j=='object'){for(const k of['data','rows','draws','results','items','records','list'])if(Array.isArray(j[k]))return j[k];const v=Object.values(j);if(v.length&&v.every(Array.isArray))return Object.keys(j).map((k,i)=>[k,...v[i]]);const f=v.find(Array.isArray);if(f)return f}return[]})();
arr.forEach(it=>{if(Array.isArray(it))nfRow(it,st);else if(typeof it=='string')nfText(it,st);else if(it&&typeof it=='object'){const k={};Object.keys(it).forEach(x=>k[nfN(x)]=it[x]);const ky=['ky','kyquay','kyso','draw','drawid','drawno','period','id'].map(x=>k[x]).find(x=>x!=null);let ns=[1,2,3,4,5,6].map(i=>['no','n','s','num','so','ball','b','number'].map(p=>k[p+i]).find(x=>x!=null));if(ns.some(x=>x==null)){const a=['numbers','balls','so','result','results','bo','boso','winningnumbers'].map(x=>k[x]).find(Array.isArray);ns=a&&a.length==6?a:[]}if(ns.length==6&&ky!=null){const sm=st.m;st.m=null;nfRow([ky,...ns],st);st.m=sm}else st.bad++}else if(it!=null&&it!=='')st.bad++})}
async function nfInf(b){return new Response(new Blob([b]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer()}
async function nfXlsx(buf,st){if(typeof DecompressionStream=='undefined')throw new Error('Trình duyệt chưa hỗ trợ đọc tệp .xlsx. Hãy lưu tệp thành CSV rồi nạp lại.');
const u=new Uint8Array(buf),v=new DataView(buf),dec=new TextDecoder();let e=-1;for(let i=u.length-22;i>=Math.max(0,u.length-65558);i--)if(v.getUint32(i,true)==0x06054b50){e=i;break}if(e<0)throw new Error('Tệp .xlsx không hợp lệ.');
const cnt=v.getUint16(e+10,true);let p=v.getUint32(e+16,true);const ent={};for(let i=0;i<cnt;i++){if(v.getUint32(p,true)!=0x02014b50)break;const m=v.getUint16(p+10,true),cs=v.getUint32(p+20,true),nl=v.getUint16(p+28,true),xl=v.getUint16(p+30,true),cl=v.getUint16(p+32,true),lo=v.getUint32(p+42,true),nm=dec.decode(u.subarray(p+46,p+46+nl));ent[nm]={m,cs,lo};p+=46+nl+xl+cl}
const rd=async n=>{const x=ent[n];if(!x)return null;const q=x.lo,d0=q+30+v.getUint16(q+26,true)+v.getUint16(q+28,true),raw=u.slice(d0,d0+x.cs);return dec.decode(x.m==0?raw:await nfInf(raw))};
const px=s=>new DOMParser().parseFromString(s,'application/xml'),T=(o,n)=>Array.from(o.getElementsByTagNameNS('*',n));
const ss=[],sx=await rd('xl/sharedStrings.xml');if(sx)T(px(sx),'si').forEach(si=>ss.push(T(si,'t').map(t=>t.textContent).join('')));
const sh=Object.keys(ent).filter(n=>/^xl\/worksheets\/sheet\d+\.xml$/.test(n)).sort((a,b)=>parseInt(a.match(/\d+/)[0])-parseInt(b.match(/\d+/)[0]));if(!sh.length)throw new Error('Không thấy trang tính nào trong tệp .xlsx.');
for(const n of sh){st.m=null;T(px(await rd(n)),'row').forEach(r=>{const c=[];T(r,'c').forEach((x,i)=>{const cm=/^[A-Z]+/.exec(x.getAttribute('r')||'');let ci=i;if(cm){ci=0;for(const ch of cm[0])ci=ci*26+ch.charCodeAt(0)-64;ci--}const t=x.getAttribute('t'),ve=T(x,'v')[0];let val='';if(t=='s')val=ve?ss[+ve.textContent]||'':'';else if(t=='inlineStr')val=T(x,'t').map(q=>q.textContent).join('');else if(ve)val=ve.textContent;c[ci]=val});for(let i=0;i<c.length;i++)if(c[i]==null)c[i]='';nfRow(c,st)})}}
async function nfLoad(f){if(!f)return;NFR={busy:1};nfPrev();try{if(f.size>25e6)throw new Error('Tệp quá lớn (tối đa 25 MB).');const nm=f.name.toLowerCase();if(/\.xls$/.test(nm))throw new Error('Chưa hỗ trợ .xls cũ. Hãy lưu thành .xlsx hoặc CSV.');
const buf=await new Response(f).arrayBuffer(),st={m:null,h:0,bad:0,rng:0,ok:[]};if(/\.xlsx$/.test(nm)||new Uint8Array(buf.slice(0,2)).join()=='80,75')await nfXlsx(buf,st);else{const t=new TextDecoder().decode(buf);if(/\.json$/.test(nm)||/^\s*[\[{]/.test(t.replace(/^\uFEFF/,''))){let j;try{j=JSON.parse(t.replace(/^\uFEFF/,''))}catch(e){throw new Error('Tệp JSON không đọc được.')}nfJson(j,st)}else nfText(t,st)}
NFR={name:f.name,h:st.h,bad:st.bad,rng:st.rng,ok:st.ok}}catch(e){NFR={err:e.message||'Không đọc được tệp.'}}nfPrev()}
function nfPlan(){const have=new Set(D.map(r=>r[0])),seen=new Set(),nw=[];let ex=0;NFR.ok.forEach(r=>{if(have.has(r[0])||seen.has(r[0]))ex++;else{seen.add(r[0]);nw.push(r)}});nw.sort((a,b)=>a[0]-b[0]);return{nw,ex}}
