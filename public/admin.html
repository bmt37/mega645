<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Quản trị MEGA 6/45</title>
<style>body{font:16px system-ui,sans-serif;max-width:560px;margin:0 auto;padding:16px;background:#fff;color:#111}@media(prefers-color-scheme:dark){body{background:#10161c;color:#e8edf2}textarea{background:#1a232c;color:inherit}}textarea{width:100%;box-sizing:border-box;height:120px;font:16px monospace;padding:8px}button{padding:10px 16px;margin:8px 8px 8px 0;font-size:16px}pre{white-space:pre-wrap}#m{font-weight:700}</style></head><body>
<h2>Quản trị kỳ quay</h2><p id="who">Nhập mật khẩu để đăng nhập.</p><div id="lg"><input id="pw" type="password" autocomplete="current-password" style="padding:10px;font-size:16px;width:60%"> <button onclick="login()">Đăng nhập</button></div><pre id="last"></pre>
<p>Mỗi dòng một kỳ: 6 số (tự gán kỳ kế tiếp) hoặc 7 số (kỳ rồi 6 số).</p>
<textarea id="t" placeholder="03 10 15 22 31 44"></textarea><div id="m"></div>
<button onclick="add()">Thêm kỳ</button><button onclick="del()">Xóa kỳ mới nhất</button>
<script>
let next=1;const $=s=>document.querySelector(s),say=(x)=>$('#m').textContent=x;
async function api(m,b){const r=await fetch('/api/admin/draws',{method:m,headers:{'X-Admin-Key':encodeURIComponent(sessionStorage.k||'')},body:b&&JSON.stringify(b)});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Lỗi '+r.status);return j}
async function load(){try{const j=await api('GET');$('#who').textContent='Đã đăng nhập';$('#lg').style.display='none';next=(j.last[0]||[0])[0]+1;$('#last').textContent=j.last.map(r=>'#'+r[0]+'  '+r.slice(1).map(x=>String(x).padStart(2,'0')).join(' ')).join('\n')}catch(e){$('#who').textContent=e.message;$('#lg').style.display=''}}
function login(){sessionStorage.k=$('#pw').value;$('#pw').value='';load()}
async function add(){try{let k=next;const d=$('#t').value.split('\n').map(l=>l.match(/\d+/g)).filter(Boolean).map(a=>{a=a.map(Number);if(a.length==6)a=[k++,...a];else if(a.length==7)k=a[0]+1;else throw new Error('Dòng sai: '+a.join(' '));return a});
if(!d.length)throw new Error('Chưa có dữ liệu');if(!confirm('Thêm '+d.length+' kỳ, từ #'+d[0][0]+' đến #'+d[d.length-1][0]+'?'))return;const j=await api('POST',{draws:d});say('Đã thêm '+j.added+' kỳ');$('#t').value='';load()}catch(e){say(e.message)}}
async function del(){if(!confirm('Xóa kỳ mới nhất #'+(next-1)+'?'))return;try{await api('DELETE');say('Đã xóa');load()}catch(e){say(e.message)}}
if(sessionStorage.k)load();
</script></body></html>
